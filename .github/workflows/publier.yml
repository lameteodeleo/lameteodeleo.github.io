# La météo de Léo : publication automatique sur Instagram et sur la Page Facebook.
#  - Story du jour : après la première mise à jour météo réussie entre 6 h 45 et 10 h 30 (heure de Paris),
#    ou vers 7 h 15 au plus tard si les prévisions ont moins de 3 heures.
#  - Reel de demain : après la première mise à jour météo réussie entre 17 h et 21 h,
#    ou vers 18 h 35 au plus tard si les prévisions ont moins de 3 heures.
#  - Contrôles : vers 10 h 40 et 21 h 10 (heure d'hiver), le robot vérifie que tout est paru ;
#    sinon, ce travail échoue et GitHub envoie un e-mail d'alerte.
#  - Contrôle : de 7 h à 22 h, après chaque mise à jour, le robot vérifie le site et toute l'appli (chaque commune, 3 jours,
#    visuels, carte) ; avant chaque Reel, il vérifie le Reel lui-même. Un défaut grave = pas de publication + e-mail.
#  - Vigilance orange ou rouge dans le 13 : après chaque mise à jour météo entre 7 h et 22 h, le robot publie
#    une alerte (story + publication sur la Page), une seule fois par épisode, et ouvre un ticket GitHub
#    (donc un e-mail) pour prévenir Léo.
name: Publication Instagram et Facebook

on:
  workflow_run:
    workflows: ["Mise à jour météo"]
    types: [completed]
  schedule:
    - cron: "10 20 * * *" # contrôle du Reel (21 h 10 en hiver, 22 h 10 en été)
    - cron: "40 9 * * *"  # contrôle de la story (10 h 40 en hiver, 11 h 40 en été)
    - cron: "12 5,6 * * *" # filet de sécurité : story vers 7 h 15 même si la mise à jour de 7 h est en retard
    - cron: "32 17 * * *"  # filet de sécurité : Reel vers 18 h 35 (hiver) même si la mise à jour de 18 h est en retard
  workflow_dispatch:
    inputs:
      mode:
        description: "test = tout préparer sans publier ; reel ou story = publier maintenant"
        type: choice
        options: [test, reel, story, test-alerte]
        default: test
      type_test:
        description: "En mode test : préparer le Reel ou la story"
        type: choice
        options: [reel, story]
        default: reel
      jour_reel:
        description: "Reel : pour demain (normal) ou pour aujourd'hui (rattrapage du matin)"
        type: choice
        options: [demain, aujourdhui]
        default: demain
      forcer:
        description: "Publier même si un Reel ou une story est déjà paru aujourd'hui (ex. : un Reel posté à la main le matin)"
        type: boolean
        default: false
      alerte_simulee:
        description: "Essai d'alerte (rien n'est publié) : niveau|phénomène|jour (0 = aujourd'hui, 1 = demain)"
        type: string
        default: "3|vent violent|0"
      reseaux:
        description: "Réseaux"
        type: choice
        options: ["instagram,facebook", "instagram", "facebook"]
        default: "instagram,facebook"

permissions:
  contents: read
  issues: write      # pour prévenir Léo par e-mail quand une alerte vigilance est publiée

env:
  # « oui » : publication automatique chaque jour. « non » : seulement à la main (bouton « Run workflow »).
  PUBLICATION_AUTO: "oui"

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Faut-il publier maintenant ?
        id: creneau
        run: |
          hm=$(TZ=Europe/Paris date +%H%M); hm=$((10#$hm))
          go=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$PUBLICATION_AUTO" != "oui" ]; then go=false; echo "Publication automatique en pause."; fi
          if [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ github.event.schedule }}" = "12 5,6 * * *" ] || [ "${{ github.event.schedule }}" = "32 17 * * *" ]; then
            if ! { [ $hm -ge 645 ] && [ $hm -lt 1030 ]; } && ! { [ $hm -ge 1700 ] && [ $hm -lt 2100 ]; }; then go=false; fi
          fi
          # De 7 h à 22 h, le robot passe à chaque mise à jour, même hors des créneaux : contrôle de l'appli et du site,
          # et alerte si le 13 est en vigilance orange ou rouge (il ne publie un Reel ou une story que dans leurs créneaux)
          if [ "$go" = false ] && [ "${{ github.event_name }}" = "workflow_run" ] && [ "$PUBLICATION_AUTO" = "oui" ] && [ $hm -ge 700 ] && [ $hm -lt 2200 ]; then go=true; fi
          if false; then
            niv=$(curl -sf --retry 3 "https://lameteodeleo.fr/data/meteo.json?t=$(date +%s)" | python3 -c '
          import sys, json
          from datetime import datetime, timezone
          try:
              V = json.load(sys.stdin).get("vigilance") or {}
          except Exception:
              print(0); sys.exit()
          now = datetime.now(timezone.utc); n = 0
          for k in ("J", "J1"):
              P = V.get(k) or {}; d = (P.get("deps") or {}).get("13") or {}
              for p in (d.get("phen") or []) + ((d.get("cote") or {}).get("phen") or []):
                  fin = p.get("a")
                  if fin and datetime.fromisoformat(fin.replace("Z", "+00:00")) <= now: continue
                  n = max(n, p.get("c") or 0)
          print(n)' || echo 0)
            echo "Vigilance du 13 (orange = 3, rouge = 4) : $niv"
            if [ "${niv:-0}" -ge 3 ]; then go=true; fi
          fi
          echo "Heure de Paris : $(TZ=Europe/Paris date '+%H h %M') ; publier : $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.creneau.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.creneau.outputs.go == 'true'
        with:
          node-version: 20
      - name: Outils (Chrome, ffmpeg)
        if: steps.creneau.outputs.go == 'true'
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.49.1
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          # Instruments pour la musique du Reel (banque de sons libre) ; en cas d'échec, le Reel part en silence
          (sudo apt-get install -y -qq fluidsynth fluid-soundfont-gm musescore-general-soundfont >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq fluidsynth fluid-soundfont-gm musescore-general-soundfont >/dev/null 2>&1)) || echo "Instruments indisponibles"
          # Dictionnaire français pour la vérification d'orthographe (un échec ici ne bloque rien)
          (sudo apt-get install -y -qq hunspell hunspell-fr whois >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq hunspell hunspell-fr whois >/dev/null 2>&1)) || echo "Dictionnaire indisponible"
          google-chrome --version
      - name: Publier
        if: steps.creneau.outputs.go == 'true'
        run: node scripts/publier.mjs
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'schedule' && (github.event.schedule == '10 20 * * *' && 'controle-reel' || github.event.schedule == '40 9 * * *' && 'controle-story' || 'auto')) || 'auto' }}
          TYPE_TEST: ${{ inputs.type_test }}
          RESEAUX: ${{ inputs.reseaux || 'instagram,facebook' }}
          REEL_JOUR: ${{ inputs.jour_reel || 'demain' }}
          FORCER: ${{ inputs.forcer && 'oui' || 'non' }}
          ALERTE_SIMULEE: ${{ inputs.alerte_simulee }}
      - name: Prévenir Léo de l'alerte publiée (ticket GitHub = e-mail)
        if: always() && hashFiles('publication/alerte.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title "$(head -n 1 publication/alerte.txt)" --body-file publication/alerte.txt
      - name: Images de l'essai d'alerte
        if: always() && inputs.mode == 'test-alerte'
        uses: actions/upload-artifact@v4
        with:
          name: essai-alerte
          path: |
            publication/alerte-*.jpg
            publication/alerte-*.mp4
