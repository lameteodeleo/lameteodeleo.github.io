name: Démo musique
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instruments
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fluidsynth fluid-soundfont-gm ffmpeg >/dev/null
          sudo apt-get install -y -qq musescore-general-soundfont >/dev/null 2>&1 || sudo apt-get install -y -qq musescore-general-soundfont-small >/dev/null 2>&1 || echo "Banque MuseScore introuvable"
          find /usr/share -iname "*.sf[23]" -size +1M 2>/dev/null
      - name: Composer et jouer
        run: |
          mkdir -p demos/musique && rm -f demos/musique/*
          SF=$(find /usr/share -iname "MuseScore_General*.sf[23]" 2>/dev/null | head -1); SF=${SF:-/usr/share/sounds/sf2/FluidR3_GM.sf2}; echo "Banque : $SF"
          for x in "pluie:lofi 2026-11-28 0.6" "soleil:chillhop 2026-11-28 0.5" "froid:lofi 2026-11-28 0.5" "vent:chillhop 2026-11-28 0.6"; do
            set -- $x
            node scripts/compose.mjs $1 16 /tmp/m.mid $2 $3
            fluidsynth -ni -g 0.7 -r 48000 -F /tmp/m.wav "$SF" /tmp/m.mid >/dev/null
            FC=$(node -e 'import("./scripts/compose.mjs").then(m=>console.log(m.mastering({entree:"0:a",debut:0.3,fin:14.5,fondu:1.5})))')
            ffmpeg -loglevel error -y -i /tmp/m.wav -t 16 -filter_complex "$FC" -map "[a]" -ar 48000 -b:a 192k demos/musique/${1//:/-}-$2.mp3
          done
          ls -la demos/musique
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/musique && git commit -m "Démo musique" && git pull --rebase && git push
