# La météo de Léo : mise à jour automatique toutes les 2 heures et mise en ligne sur GitHub Pages.
name: Mise à jour météo

on:
  schedule:
    - cron: "17 */2 * * *" # toutes les 2 heures, à la minute 17 (heure UTC) ; le « Maintenant » de l app est en direct
  push:
    branches: [main]      # et à chaque modification du code
  workflow_dispatch:      # bouton « Run workflow » pour lancer à la main
    inputs:
      test_mesures:
        description: "Tester la lecture des mesures horaires de Météo-France (journal seulement)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les prévisions et préparer le site
        run: node scripts/update.mjs
        env:
          MF_VIGILANCE_KEY: ${{ secrets.MF_VIGILANCE_KEY }}
          TEST_MESURES: ${{ inputs.test_mesures }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
