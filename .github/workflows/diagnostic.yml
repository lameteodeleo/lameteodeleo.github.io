name: Diagnostic statistiques
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.49.1
      - name: Visite test de l'app et d'une page commune
        run: |
          cat > d.mjs <<'JS'
          import { chromium } from "playwright-core";
          const b = await chromium.launch({ channel: "chrome" });
          for (const url of ["https://lameteodeleo.fr/", "https://lameteodeleo.fr/meteo/rognes/"]) {
            const p = await b.newPage();
            p.on("console", m => { if (/Content Security|Refused/i.test(m.text())) console.log("CSP :", m.text().slice(0, 300)); });
            p.on("request", r => { if (/umami/.test(r.url())) console.log("requête :", r.method(), r.url()); });
            p.on("response", r => { if (/umami/.test(r.url())) console.log("réponse :", r.status(), r.url()); });
            p.on("requestfailed", r => { if (/umami/.test(r.url())) console.log("ÉCHEC :", r.url(), r.failure() && r.failure().errorText); });
            console.log("== " + url);
            await p.goto(url, { waitUntil: "load" }); await p.waitForTimeout(6000);
            console.log("umami chargé :", await p.evaluate(() => typeof window.umami));
            await p.close();
          }
          await b.close();
          JS
          node d.mjs
